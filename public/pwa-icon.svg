<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a81625"/>
      <stop offset="60%" stop-color="#690710"/>
      <stop offset="100%" stop-color="#2a0206"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- App Background with Gold Border -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#gold)" stroke-width="8"/>
  
  <!-- Subtle card deck motif -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Left Card -->
    <rect x="-130" y="-120" width="110" height="160" rx="12" fill="#ffffff" transform="rotate(-15)" stroke="#e2e8f0" stroke-width="3"/>
    <text x="-95" y="-30" font-family="sans-serif" font-weight="900" font-size="48" fill="#dc2626" text-anchor="middle" transform="rotate(-15)">♥</text>
    
    <!-- Right Card -->
    <rect x="20" y="-120" width="110" height="160" rx="12" fill="#ffffff" transform="rotate(15)" stroke="#e2e8f0" stroke-width="3"/>
    <text x="55" y="-30" font-family="sans-serif" font-weight="900" font-size="48" fill="#1e293b" text-anchor="middle" transform="rotate(15)">♣</text>
    
    <!-- Center Spade Medallion -->
    <circle cx="0" cy="-20" r="82" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M 0 -70 C 18 -45 52 -25 52 2 C 52 24 35 38 14 38 C 4 38 0 32 0 32 C 0 32 -4 38 -14 38 C -35 38 -52 24 -52 2 C -52 -25 -18 -45 0 -70 Z M -12 36 L 12 36 L 16 58 L -16 58 Z" fill="url(#gold)"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="390" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    MASTER
  </text>
  <text x="256" y="440" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="8">
    RUMMY
  </text>
</svg>
